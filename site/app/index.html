  <script>
    // Boot watchdog (CONTRACTS.md §12.9). If one of the Studio's modules fails to download or to link, js/ui/app.js
    // never runs and the spinner would turn forever, so say what happened and offer a Reload button. app.js marks
    // #app with data-boot as soon as it runs, which turns this off. No network requests. If you enable the CSP in
    // site/_headers, its script-src must list this script's hash (npm test checks it).
    (function () {
      var failed = false;
      function running() { var a = document.getElementById('app'); return !a || a.hasAttribute('data-boot'); }
      function show(fatal) {
        var box = document.querySelector('#preview .pane-loading');
        if (failed || running() || !box) return;
        failed = fatal;
        if (fatal) document.getElementById('app').removeAttribute('aria-busy');
        var p = document.createElement('p');
        p.textContent = fatal
          ? 'The Studio couldn’t load. Check your connection, then reload the page (if that doesn’t help, hold Shift while you reload). Books you made before are still saved in this browser.'
          : 'This is taking longer than usual. On a slow connection it can take a minute; if nothing happens, reload the page.';
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'btn btn-sm'; b.textContent = 'Reload';
        b.onclick = function () { location.reload(); };
        box.className = 'pane-loading boot-stalled';
        box.setAttribute('role', fatal ? 'alert' : 'status');
        box.replaceChildren(p, b);
      }
      addEventListener('error', function (e) {
        var t = e.target;
        if (t && t.tagName === 'SCRIPT') { if (t.type === 'module') show(true); return; }
        if (e.filename && e.filename.indexOf(location.origin + '/') === 0) show(true);
      }, true);
      setTimeout(function () { show(false); }, 15000);
    })();
  </script>
